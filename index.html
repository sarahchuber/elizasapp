<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="doyoshit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>doyoshit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --purple:#96C0B7;
  --lav:#E7CEE3;
  --red:#6D2E46;
  --olive:#2C6E49;
  --ink:#5762D5;
  --cream:#96C0B7;
  --bg:#6D2E46;
  --card:#F5CCE8;
  --mute:rgba(39,39,39,.58);
  --line:rgba(39,39,39,.16);
  --line2:rgba(39,39,39,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#6D2E46;
    --card:#F5CCE8;
    --ink:#5762D5;
    --mute:rgba(39,39,39,.58);
    --line:rgba(39,39,39,.16);
    --line2:rgba(39,39,39,.28);
  }
}

:root[data-theme="dark"]{
  --bg:#6D2E46;
  --card:#F5CCE8;
  --ink:#5762D5;
  --mute:rgba(39,39,39,.58);
  --line:rgba(39,39,39,.16);
  --line2:rgba(39,39,39,.28);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-padding-top:env(safe-area-inset-top,0px);
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  overscroll-behavior-x:none;
  touch-action:pan-y;
}

body{
  margin:0;
  width:100%;
  max-width:520px;
  min-width:0;
  overflow-x:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:Inter,-apple-system,system-ui,sans-serif;
  padding:6px 12px 90px;
  margin-left:auto;
  margin-right:auto;
  -webkit-text-size-adjust:100%;
}

.disp{
  font-family:"Space Grotesk",Inter,sans-serif;
  font-weight:700;
}

#app{
  width:100%;
  max-width:100%;
  min-width:0;
  overflow-x:hidden;
}

header{
  padding:10px 14px;
  background:var(--cream);
  border-radius:22px;
  margin-bottom:8px;
}

header .eyebrow,
header .sub,
header .sub b{
  color:var(--olive);
}

.eyebrow{
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--mute);
  font-weight:600;
}

.htop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.hleft{
  flex:1;
  min-width:0;
}

.title{
  font-family:"Baloo 2","Space Grotesk",sans-serif;
  font-weight:800;
  font-size:60px;
  line-height:.82;
  letter-spacing:1;
  text-align:right;
  color:var(--olive);
  white-space:nowrap;
  align-self:stretch;
  display:flex;
}

.hero .title{
  color:#E7CEE3;
}

.big{
  font-size:46px;
  line-height:1;
  margin-top:6px;
  letter-spacing:-.01em;
}

header .big{
  color:var(--olive);
}

.big.neg{
  color:var(--red);
}

.unit{
  font-size:16px;
  color:var(--mute);
  font-family:Inter,sans-serif;
  font-weight:500;
  margin-left:2px;
}

.sub{
  color:var(--mute);
  font-size:14px;
  margin-top:6px;
}

.sub b{
  color:var(--ink);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:14px 12px;
  margin-bottom:12px;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
}

h2{
  font-size:16px;
  margin:2px 4px 10px;
  display:flex;
  align-items:center;
  gap:8px;
}

h2 .dot{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
}

h2 em{
  font-family:Inter,sans-serif;
  font-weight:500;
  font-style:normal;
  font-size:11.5px;
  color:var(--mute);
  margin-left:auto;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) repeat(7,30px);
  gap:4px;
  align-items:center;
  padding:6px 0;
  width:100%;
  min-width:0;
}

.row+.row:not(.hd){
  border-top:1px solid var(--line);
}

.hd{
  text-align:center;
  font-size:10.5px;
  color:var(--mute);
  padding-top:0;
  font-weight:600;
}

.hd b{
  display:block;
  font-weight:700;
  font-size:12px;
  margin-top:1px;
  color:var(--ink);
}

.hd .t b{
  color:var(--purple);
}

.lbl{
  font-size:13.5px;
  line-height:1.2;
  font-weight:600;
  padding-right:4px;
  text-transform:lowercase;
  min-width:0;
  overflow:hidden;
}

.lbl small{
  display:block;
  color:var(--mute);
  font-weight:500;
  font-size:10.5px;
  margin-top:2px;
}

.c{
  width:30px;
  min-width:30px;
  max-width:30px;
  height:30px;
  min-height:30px;
  max-height:30px;
  box-sizing:border-box;
  display:block;
  flex:none;
  border-radius:9px;
  border:1.5px solid var(--ink);
  background:var(--ink);
  color:#E7CEE3;
  font-size:15px;
  line-height:27px;
  padding:0;
  margin:0;
  font-family:inherit;
  font-weight:800;
  overflow:hidden;
  appearance:none;
  -webkit-appearance:none;
  transform:none;
}

.c.today{
  border-color:var(--purple);
  border-width:1.5px;
  box-shadow:inset 0 0 0 2.5px var(--purple);
}

.c.s1{
  background:var(--olive);
  border-color:var(--olive);
}

.c.future{
  opacity:.4;
  pointer-events:none;
}

.c.today.s1{
  border-color:var(--purple);
}

.note{
  font-size:11.5px;
  color:var(--mute);
  text-align:center;
  margin:10px 4px 0;
  line-height:1.4;
}

.pri{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  background:var(--purple);
  color:#E7CEE3;
  font:700 15px "Space Grotesk",sans-serif;
  margin-top:10px;
  letter-spacing:.01em;
}

.pri:disabled{
  opacity:.35;
}

.ghost{
  width:100%;
  border:0;
  background:none;
  color:var(--mute);
  font:600 14px Inter,sans-serif;
  padding:12px;
}

nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  width:100%;
  max-width:100vw;
  overflow:hidden;
  display:flex;
  justify-content:center;
  gap:8px;
  background:var(--bg);
  border-top:1px solid var(--line);
  padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));
}

nav button{
  flex:1;
  max-width:240px;
  border:0;
  border-radius:13px;
  padding:11px;
  background:none;
  color:var(--mute);
  font:700 13.5px "Space Grotesk",sans-serif;
  letter-spacing:.02em;
}

nav button.on{
  background:var(--olive);
  color:#E7CEE3;
}

.bar{
  margin:12px 4px;
}

.bar>div:first-child{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:5px;
  font-weight:600;
}

.trk{
  height:9px;
  background:var(--line);
  border-radius:6px;
  overflow:hidden;
}

.trk i{
  display:block;
  height:100%;
  border-radius:6px;
}

.grp{
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--mute);
  margin:14px 4px 2px;
  font-weight:700;
}

.wk{
  display:flex;
  justify-content:space-between;
  padding:11px 4px;
  font-size:14px;
  border-top:1px solid var(--line);
}

.wk span{
  color:var(--mute);
  font-weight:600;
}

.wk span.neg{
  color:var(--red);
}

.hero{
  background:linear-gradient(135deg,var(--purple),var(--olive));
  border-radius:22px;
  padding:20px 16px;
  margin-bottom:12px;
  color:#E7CEE3;
}

.hero .eyebrow{
  color:rgba(255,255,255,.75);
}

.hero .big{
  color:#E7CEE3;
}

.hero .sub{
  color:rgba(255,255,255,.85);
}

.hero .sub b{
  color:#E7CEE3;
}

#m{
  position:fixed;
  inset:0;
  background:rgba(20,18,16,.45);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:9;
}

#m.open{
  display:flex;
}

.sheet{
  background:var(--card);
  width:100%;
  max-width:520px;
  border-radius:24px 24px 0 0;
  padding:22px 20px calc(18px + env(safe-area-inset-bottom,0px));
}

.sheet h3{
  font-family:"Space Grotesk",sans-serif;
  margin:0 0 6px;
  font-size:21px;
  font-weight:700;
}

.sheet p{
  color:var(--mute);
  font-size:14px;
  margin:8px 0;
  line-height:1.5;
}

.sheet .row2{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  padding:7px 0;
  border-top:1px solid var(--line);
}

#err{
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:var(--red);
  color:#E7CEE3;
  padding:12px 16px;
  font:600 13px Inter,sans-serif;
  z-index:99;
  display:none;
}

/* iPhone stability */
@media (max-width:520px){
  html,
  body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
    position:relative;
  }

  body{
    padding-left:12px;
    padding-right:12px;
  }

  .card,
  header,
  .hero{
    width:100%;
    max-width:100%;
    min-width:0;
  }

  .row{
    grid-template-columns:minmax(0,1fr) repeat(7,30px);
    column-gap:4px;
  }

  .c,
  .c.s1,
  .c.today,
  .c.today.s1{
    width:30px!important;
    min-width:30px!important;
    max-width:30px!important;
    height:30px!important;
    min-height:30px!important;
    max-height:30px!important;
    box-sizing:border-box!important;
  }
}

/* SAVINGS LINE */

.savings-line{
  width:100%;
  min-width:0;
  height:20px;
  line-height:20px;
  margin-top:14px;
  overflow:hidden;
  font-size:14px;
  color:var(--mute);
}

.savings-text{
  display:block;
  width:100%;
  height:20px;
  line-height:20px;
  white-space:nowrap;
  overflow:hidden;
}

.carry-text{
  display:block;
  width:100%;
  height:20px;
  line-height:20px;
  white-space:nowrap;
  overflow:hidden;
}

.carry-placeholder{
  display:block;
  width:100%;
  height:20px;
}

/* Reset button */

.reset-wrap{
  padding:18px 4px 10px;
  text-align:center;
}

.reset-btn{
  border:0;
  background:none;
  color:var(--mute);
  font:600 12px Inter,sans-serif;
  padding:12px 16px;
  text-decoration:underline;
  text-underline-offset:3px;
}
</style>

</head>

<body>

<div id="err"></div>
<div id="app"></div>

<nav>
  <button data-t="week" onclick="go('week')">Week</button>
  <button data-t="log" onclick="go('log')">Log</button>
</nav>

<div id="m"></div>

<script>

window.onerror=function(m){
  var e=document.getElementById("err");
  e.textContent="Something broke: "+m;
  e.style.display="block";
};

var DAILY=[
  ["ex","exercise",150],
  ["brain","brain improvement",100],
  ["hobby","hobby improvement",50]
];

var WEEKLY=[
  ["bathroom","clean the bathroom",200],
  ["climb1","climb once",100],
  ["climb2","climb twice",100],
  ["album","listen to a new album",100]
];

var DN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],
    KEY="yolosybl.v1";

var tab="week",
    S=load();

function z(n){
  return String(n).padStart(2,"0");
}

function iso(d){
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate());
}

function pd(s){
  return new Date(s+"T00:00:00");
}

function fmt(d){
  return d.toLocaleDateString("en-US",{
    month:"short",
    day:"numeric"
  });
}

function monday(d){
  var x=new Date(d);
  x.setHours(0,0,0,0);
  x.setDate(x.getDate()-((x.getDay()+6)%7));
  return x;
}

function money(n){
  return "$"+Math.abs(n).toFixed(2);
}

function load(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY));

    if(s&&s.week){
      return s;
    }

  }catch(e){}

  return{
    week:iso(monday(new Date())),
    carry:0,
    d:{},
    w:{},
    hist:[]
  };
}

function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify(S));
  }catch(e){}
}

/*
 * RESET CURRENT WEEK ONLY
 *
 * This does NOT touch:
 *   - S.hist
 *   - S.carry
 *   - S.week
 *
 * It only clears the current week's task states.
 */
function resetApp(){

  var confirmed=confirm(
    "Reset this week's checkboxes?\n\nYour previous weeks and savings history will not be affected."
  );

  if(!confirmed) return;

  S.d={};
  S.w={};

  save();

  tab="week";
  render();

  window.scrollTo(0,0);
}

function todayIdx(){

  var t=new Date();

  t.setHours(0,0,0,0);

  var n=Math.round(
    (t-pd(S.week))/86400000
  );

  return (n>=0&&n<7)?n:-1;
}

function closable(){

  var s=pd(S.week);

  s.setDate(s.getDate()+6);
  s.setHours(18,0,0,0);

  return new Date()>=s;
}

function tapDaily(id,i){

  if(i>todayIdx()) return;

  var r=S.d[id]||(
    S.d[id]=[0,0,0,0,0,0,0]
  );

  /*
   * Only two states now:
   * 0 = blank
   * 1 = complete
   */
  r[i]=r[i]===1?0:1;

  save();
  render();
}

function tapWeekly(id,i){

  if(i>todayIdx()) return;

  var cur=S.w[id];

  /*
   * Only two states now:
   * blank = not completed
   * state 1 = completed
   */
  if(cur && cur.day===i){

    S.w[id]=null;

  }else{

    S.w[id]={
      day:i,
      state:1
    };
  }

  save();
  render();
}

function livePoints(){

  var p=0;

  DAILY.forEach(function(t){

    var id=t[0],
        a=t[2],
        r=S.d[id]||[];

    for(var i=0;i<7;i++){

      if(r[i]===1){
        p+=a;
      }
    }
  });

  WEEKLY.forEach(function(t){

    var id=t[0],
        a=t[2],
        w=S.w[id];

    if(w&&w.state===1){
      p+=a;
    }
  });

  return p;
}

function finalPoints(){

  var p=0;

  DAILY.forEach(function(t){

    var id=t[0],
        a=t[2],
        r=S.d[id]||[];

    for(var i=0;i<7;i++){

      if(r[i]===1){
        p+=a;
      }
    }
  });

  WEEKLY.forEach(function(t){

    var id=t[0],
        a=t[2],
        w=S.w[id];

    if(w&&w.state===1){
      p+=a;
    }
  });

  return{
    p:p,
    miss:0
  };
}

function go(t){

  tab=t;

  render();

  window.scrollTo(0,0);
}

function head(mon,t){

  var h='<div class="row hd"><div></div>';

  for(var i=0;i<7;i++){

    var d=new Date(mon);

    d.setDate(mon.getDate()+i);

    h+='<div class="'+
       (i===t?"t":"")+
       '">'+
       DN[i].slice(0,1)+
       '<b>'+
       d.getDate()+
       '</b>'+
       '</div>';
  }

  return h+'</div>';
}

function weekView(){

  var mon=pd(S.week),
      sun=new Date(mon);

  sun.setDate(mon.getDate()+6);

  var t=todayIdx(),
      live=livePoints(),
      pool=S.carry+live,
      h='';

  h+='<header>';

  h+='<div class="htop">';

  h+='<div class="hleft">';

  h+='<div class="eyebrow">'+
     fmt(mon)+
     ' – '+
     fmt(sun)+
     '</div>';

  h+='<div class="big">'+
     pool+
     '<span class="unit">pts</span>'+
     '</div>';

  h+='</div>';

  h+='<div class="title">doyoshit</div>';

  h+='</div>';

  h+='<div class="savings-line">';

  h+='<span class="savings-text">'+
     money(pool/100)+
     ' to add to fun money fund'+
     '</span>';

  if(S.carry){

    h+='<span class="carry-text">'+
       S.carry+
       ' pt carried from last week'+
       '</span>';

  }else{

    h+='<span class="carry-placeholder"></span>';
  }

  h+='</div>';

  h+='</header>';

  /* DAILY */

  h+='<section class="card">';

  h+='<h2>'+
     '<span class="dot" style="background:var(--purple)"></span>'+
     'daily'+
     '</h2>';

  h+=head(mon,t);

  DAILY.forEach(function(task){

    var id=task[0],
        nm=task[1],
        a=task[2],
        r=S.d[id]||[];

    h+='<div class="row">';

    h+='<div class="lbl">'+
       nm+
       '<small>+'+
       a+
       '</small>'+
       '</div>';

    for(var i=0;i<7;i++){

      var v=r[i]||0;

      h+='<button class="c s'+
         v+
         (i===t?" today":"")+
         (i>t?" future":"")+
         '" onclick="tapDaily(\''+
         id+
         '\','+
         i+
         ')">'+
         (v===1?"✓":"")+
         '</button>';
    }

    h+='</div>';
  });

  h+='</section>';

  /* WEEKLY */

  h+='<section class="card">';

  h+='<h2>'+
     '<span class="dot" style="background:var(--olive)"></span>'+
     'weekly'+
     '</h2>';

  h+=head(mon,t);

  WEEKLY.forEach(function(task){

    var id=task[0],
        nm=task[1],
        a=task[2],
        w=S.w[id];

    h+='<div class="row">';

    h+='<div class="lbl">'+
       nm+
       '<small>+'+
       a+
       '</small>'+
       '</div>';

    for(var i=0;i<7;i++){

      var v=(w&&w.day===i)?w.state:0;

      h+='<button class="c s'+
         v+
         (i===t?" today":"")+
         (i>t?" future":"")+
         '" onclick="tapWeekly(\''+
         id+
         '\','+
         i+
         ')">'+
         (v===1?"✓":"")+
         '</button>';
    }

    h+='</div>';
  });

  h+='</section>';

  if(closable()){

    h+='<button class="pri" onclick="openClose()">'+
       'Close out this week'+
       '</button>';

  }else{

    h+='<p class="note">'+
       'Week close-out unlocks Sunday at 6 pm.'+
       '</p>';
  }

  h+='<div class="reset-wrap">';

  h+='<button class="reset-btn" onclick="resetApp()">'+
     'Reset this week'+
     '</button>';

  h+='</div>';

  return h;
}

function logView(){

  var H=S.hist,
      n=H.length,
      totalSaved=0;

  H.forEach(function(x){
    totalSaved+=x.transfer;
  });

  var h='';

  h+='<div class="hero">';

  h+='<div class="htop">';

  h+='<div class="hleft">';

  h+='<div class="eyebrow">Added to fun money fund</div>';

  h+='<div class="big">'+
     money(totalSaved/100)+
     '</div>';

  h+='<div class="sub">'+
     'across '+
     n+
     ' closed week'+
     (n===1?"":"s")+
     '</div>';

  h+='</div>';

  h+='<div class="title">doyoshit</div>';

  h+='</div>';

  h+='</div>';

  if(!n){

    h+='<p class="note">'+
       'Close out your first week to start building your history.'+
       '</p>';

  }else{

    var avg=Math.round(
      H.reduce(function(s,x){
        return s+x.p;
      },0)/n
    );

    h+='<section class="card">';

    h+='<h2>'+
       '<span class="dot" style="background:var(--lav)"></span>'+
       'averages'+
       '</h2>';

    h+='<div class="wk" style="border-top:none">';

    h+='<div>Avg points per week</div>';

    h+='<span>'+
       avg+
       ' pts'+
       '</span>';

    h+='</div>';

    h+='</section>';

    h+='<section class="card">';

    h+='<h2>'+
       '<span class="dot" style="background:var(--purple)"></span>'+
       'completion rate'+
       '</h2>';

    h+='<div class="grp">daily</div>';

    DAILY.forEach(function(t){

      var id=t[0],
          nm=t[1],
          done=0;

      H.forEach(function(x){

        (x.d[id]||[]).forEach(function(v){

          if(v===1){
            done++;
          }

        });
      });

      var pc=Math.round(
        done/(7*n)*100
      );

      h+='<div class="bar">';

      h+='<div>'+
         '<span>'+nm+'</span>'+
         '<b>'+pc+'%</b>'+
         '</div>';

      h+='<div class="trk">';

      h+='<i style="width:'+
         pc+
         '%;background:var(--purple)"></i>';

      h+='</div>';

      h+='</div>';
    });

    h+='<div class="grp">weekly</div>';

    WEEKLY.forEach(function(t){

      var id=t[0],
          nm=t[1],
          done=0;

      H.forEach(function(x){

        var w=x.w[id];

        if(w&&w.state===1){
          done++;
        }

      });

      var pc=Math.round(
        done/n*100
      );

      h+='<div class="bar">';

      h+='<div>'+
         '<span>'+nm+'</span>'+
         '<b>'+pc+'%</b>'+
         '</div>';

      h+='<div class="trk">';

      h+='<i style="width:'+
         pc+
         '%;background:var(--olive)"></i>';

      h+='</div>';

      h+='</div>';
    });

    h+='</section>';

    h+='<section class="card">';

    h+='<h2>'+
       '<span class="dot" style="background:var(--red)"></span>'+
       'Weeks'+
       '</h2>';

    var rev=H.slice().reverse();

    rev.forEach(function(x){

      var m=pd(x.week),
          e=new Date(m);

      e.setDate(m.getDate()+6);

      h+='<div class="wk">';

      h+='<div>'+
         fmt(m)+
         ' – '+
         fmt(e)+
         '</div>';

      h+='<span>'+
         x.p+
         ' pts · '+
         money(x.transfer/100)+
         '</span>';

      h+='</div>';
    });

    h+='</section>';
  }

  h+='<div class="reset-wrap">';

  h+='<button class="reset-btn" onclick="resetApp()">'+
     'Reset this week'+
     '</button>';

  h+='</div>';

  return h;
}

function render(){

  document.getElementById("app").innerHTML =
    tab==="week" ? weekView() : logView();

  var btns=document.querySelectorAll("nav button");

  for(var i=0;i<btns.length;i++){

    btns[i].classList.toggle(
      "on",
      btns[i].dataset.t===tab
    );
  }
}

function openClose(){

  var f=finalPoints(),
      pool=S.carry+f.p,
      transfer=pool,
      m=document.getElementById("m"),
      h='';

  h+='<div class="sheet">';

  h+='<h3>Close out the week</h3>';

  h+='<div class="big" style="font-size:38px">'+
     pool+
     '<span class="unit">pts</span>'+
     '</div>';

  if(S.carry){

    h+='<div class="row2">'+
       '<span>Carried from before</span>'+
       '<b>'+S.carry+' pts</b>'+
       '</div>';
  }

  h+='<div class="row2">'+
     '<span>This week</span>'+
     '<b>'+f.p+' pts</b>'+
     '</div>';

  if(pool>0){

    h+='<p>Add <b>'+
       money(transfer/100)+
       '</b> to your fun money fund.</p>';

    h+='<label class="chk">'+
       '<input type="checkbox" onchange="document.getElementById(\'go\').disabled=!this.checked">'+
       ' I’ve added '+
       money(transfer/100)+
       ' to my fun money fund'+
       '</label>';

  }else{

    h+='<p>'+
       'No points earned this week. The total carries into next week.'+
       '</p>';
  }

  h+='<button id="go" class="pri" '+
     (pool>0?"disabled":"")+
     ' onclick="doClose('+f.p+')">'+
     'Start next week'+
     '</button>';

  h+='<button class="ghost" onclick="closeM()">Not yet</button>';

  h+='</div>';

  m.innerHTML=h;
  m.classList.add("open");
}

function closeM(){
  document.getElementById("m").classList.remove("open");
}

function doClose(weekPoints){

  var pool=S.carry+weekPoints,
      transfer=Math.max(0,pool),
      carryAfter=Math.min(0,pool);

  S.hist.push({
    week:S.week,
    d:S.d,
    w:S.w,
    p:weekPoints,
    carryBefore:S.carry,
    transfer:transfer
  });

  var n=pd(S.week);

  n.setDate(n.getDate()+7);

  S.week=iso(n);
  S.carry=carryAfter;
  S.d={};
  S.w={};

  save();
  closeM();

  tab="week";

  render();

  window.scrollTo(0,0);
}

render();

</script>

</body>
</html>
